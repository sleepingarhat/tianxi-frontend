name: 正式站健康監察 — Site Health
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 首頁同主要頁面回應
        run: |
          for p in / /predictor /strategy-pnl /prediction-vs-result /engine; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://tianxi.racing$p")
            echo "$p → $code"; [ "$code" = "200" ] || exit 1
          done
