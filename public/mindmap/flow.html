# 天喜運行流程
## 賽馬
- 收排位／賠率
- 首場前 90 分鐘凍結全日四揀＋第五選
- 完場收賽果・$10 派彩 CSV
- 只重算對帳，不改凍結
## 足球
- 每 6 小時收賽程
- T−6h 鎖定雙引擎（無賠率照鎖）
- BSD 陣容快照・完場官方正選對比
- 賽果入帳・Elo 更新
## 六合彩
- 每晚收攪珠・派彩
- 命中獎級對照
## 同步
- 資料推 GitHub 五倉
- 發布後鏡像 tianxi-frontend
- 異常 Telegram 告警
